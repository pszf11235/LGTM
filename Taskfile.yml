# https://taskfile.dev
# Install: brew install go-task/tap/go-task (or see https://taskfile.dev/installation/)
# Usage: task <command>

version: '3'

vars:
  LGTM_DIR: .lgtm
  FARM_DIR: "{{.HOME}}/.lgtm-farm"
  BOOTSTRAP: "{{.HOME}}/.lgtmrc"

tasks:
  # ─── Development ──────────────────────────────────────────────────────

  default:
    desc: Show available tasks
    cmds:
      - task --list

  dev:
    desc: Run lgtm in dev mode
    cmds:
      - bun run packages/core/src/index.ts {{.CLI_ARGS}}

  install:
    desc: Install all dependencies
    cmds:
      - bun install

  build:
    desc: Build the project
    cmds:
      - bun build packages/core/src/index.ts --outdir dist --target node

  # ─── Testing ──────────────────────────────────────────────────────────

  test:
    desc: Run all tests
    cmds:
      - bun test

  test:watch:
    desc: Run tests in watch mode
    cmds:
      - bun test --watch

  lint:
    desc: Type check (tsc --noEmit)
    cmds:
      - bun run lint

  check:
    desc: Run all checks (lint + test + build)
    cmds:
      - task: lint
      - task: test
      - task: build

  # ─── LGTM Management ──────────────────────────────────────────────────

  slaughter:
    desc: "🪓 Full cleanup — remove ALL lgtm data (fresh start)"
    prompt: "This will delete .lgtm/, ~/.lgtm-farm/, and ~/.lgtmrc. Continue?"
    cmds:
      - rm -rf {{.YAK_DIR}}
      - rm -rf {{.FARM_DIR}}
      - rm -f {{.BOOTSTRAP}}
      - echo "🪓 LGTM slaughtered. Run 'bun run lgtm' for a fresh start."

  slaughter:local:
    desc: "🪓 Remove only this repo's .lgtm/ directory"
    cmds:
      - rm -rf {{.YAK_DIR}}
      - echo "🪓 Local lgtm data removed. Profile and rules gone."

  slaughter:farm:
    desc: "🪓 Remove the lgtm-farm (central storage)"
    cmds:
      - rm -rf {{.FARM_DIR}}
      - echo "🪓 LGTM-farm cleared."

  slaughter:config:
    desc: "🪓 Remove only bootstrap config (~/.lgtmrc) — forces re-onboarding"
    cmds:
      - rm -f {{.BOOTSTRAP}}
      - echo "🪓 Bootstrap config removed. Next 'lgtm' run will re-onboard."

  reset:
    desc: "🔄 Full reset — slaughter + reinstall deps"
    cmds:
      - task: slaughter
      - rm -rf node_modules
      - bun install
      - echo "🔄 Fresh as a newborn lgtm."

  # ─── Info ─────────────────────────────────────────────────────────────

  info:
    desc: Show current lgtm state (config locations, profile status)
    cmds:
      - |
        echo "👍 LGTM Info"
        echo ""
        echo "Bootstrap (~/.lgtmrc):"
        if [ -f {{.BOOTSTRAP}} ]; then cat {{.BOOTSTRAP}}; else echo "  Not found (first run)"; fi
        echo ""
        echo "Local .lgtm/:"
        if [ -d {{.YAK_DIR}} ]; then ls -la {{.YAK_DIR}}/; else echo "  Not found"; fi
        echo ""
        echo "LGTM-farm:"
        if [ -d {{.FARM_DIR}} ]; then ls -la {{.FARM_DIR}}/; else echo "  Not found"; fi
        echo ""
        echo "Profile:"
        if [ -f {{.YAK_DIR}}/profile.md ]; then head -20 {{.YAK_DIR}}/profile.md; else echo "  Not found"; fi


  # ─── Debugging ────────────────────────────────────────────────────────

  debug:
    desc: Run lgtm with debug logging (writes to /tmp/lgtm-debug.log)
    cmds:
      - rm -f /tmp/lgtm-debug.log
      - LGTM_DEBUG=1 bun run packages/core/src/index.ts {{.CLI_ARGS}}

  debug:log:
    desc: Tail the debug log
    cmds:
      - tail -f /tmp/lgtm-debug.log
