<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👍 LGTM Daily Checker</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    header .badge {
      background: var(--accent);
      color: var(--bg);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .setup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .setup-card h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--muted);
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    input, select, button {
      font-family: inherit;
      font-size: 0.875rem;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      min-width: 200px;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    select {
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
    }

    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }

    .btn-danger {
      background: var(--red);
      color: white;
    }

    .repo-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .repo-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.3rem 0.6rem;
      border-radius: 16px;
      font-size: 0.8rem;
    }

    .repo-tag .remove {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .repo-tag .remove:hover { color: var(--red); }

    /* Results */
    .results { margin-top: 1.5rem; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .section-header h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .section-header .count {
      background: var(--border);
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .pr-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .pr-card .status-icon {
      font-size: 1.2rem;
      min-width: 24px;
      text-align: center;
      padding-top: 2px;
    }

    .pr-card .pr-info { flex: 1; }

    .pr-card .pr-title {
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .pr-card .pr-title a {
      color: var(--accent);
      text-decoration: none;
    }

    .pr-card .pr-title a:hover { text-decoration: underline; }

    .pr-card .pr-meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .pr-card .pr-badges {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }

    .pr-badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-weight: 500;
    }

    .pr-badge.ready { background: rgba(63,185,80,0.15); color: var(--green); }
    .pr-badge.attention { background: rgba(210,153,34,0.15); color: var(--yellow); }
    .pr-badge.blocked { background: rgba(248,81,73,0.15); color: var(--red); }
    .pr-badge.stale { background: rgba(139,148,158,0.15); color: var(--muted); }
    .pr-badge.ci-pass { background: rgba(63,185,80,0.15); color: var(--green); }
    .pr-badge.ci-fail { background: rgba(248,81,73,0.15); color: var(--red); }
    .pr-badge.ci-pending { background: rgba(210,153,34,0.15); color: var(--yellow); }

    /* Standup */
    .standup-output {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1rem;
      white-space: pre-wrap;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .standup-output .copy-btn {
      float: right;
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem;
      color: var(--muted);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Summary bar */
    .summary-bar {
      display: flex;
      gap: 1.5rem;
      padding: 1rem 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .summary-stat {
      text-align: center;
    }

    .summary-stat .num {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .summary-stat .label {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .summary-stat.green .num { color: var(--green); }
    .summary-stat.yellow .num { color: var(--yellow); }
    .summary-stat.red .num { color: var(--red); }
    .summary-stat.gray .num { color: var(--muted); }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    .empty-state .icon { font-size: 2rem; margin-bottom: 0.5rem; }

    /* Responsive */
    @media (max-width: 600px) {
      body { padding: 1rem; }
      .summary-bar { flex-wrap: wrap; gap: 1rem; }
      .form-row { flex-direction: column; }
      input[type="text"], input[type="password"] { min-width: unset; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>👍 LGTM Daily Checker</h1>
      <span class="badge">webapp</span>
    </header>

    <!-- Setup -->
    <div class="setup-card" id="setup">
      <h2>⚙ Configuration</h2>
      <div class="form-row">
        <input type="password" id="token-input" placeholder="GitHub Personal Access Token (ghp_...)" />
        <button class="btn-primary" onclick="saveToken()">Save</button>
      </div>
      <div class="form-row">
        <input type="password" id="openai-key-input" placeholder="OpenAI API Key (sk-...)" />
        <button class="btn-secondary" onclick="saveAIKey('openai')">Save</button>
        <a href="https://platform.openai.com/api-keys" target="_blank" style="color:var(--muted);font-size:0.8rem;align-self:center;">Get key ↗</a>
      </div>
      <div class="form-row">
        <input type="password" id="anthropic-key-input" placeholder="Anthropic API Key (sk-ant-...)" />
        <button class="btn-secondary" onclick="saveAIKey('anthropic')">Save</button>
        <a href="https://console.anthropic.com/settings/keys" target="_blank" style="color:var(--muted);font-size:0.8rem;align-self:center;">Get key ↗</a>
      </div>
      <div id="ai-status" style="font-size:0.8rem;color:var(--muted);margin-top:0.25rem;"></div>
      <div class="form-row" style="margin-top:0.75rem;">
        <input type="text" id="repo-input" placeholder="owner/repo (e.g. pszf11235/LGTM)" />
        <button class="btn-secondary" onclick="addRepo()">Add Repo</button>
      </div>
      <div class="repo-list" id="repo-list"></div>
    </div>

    <!-- Actions -->
    <div class="form-row" style="margin-bottom: 1.5rem;">
      <button class="btn-primary" id="run-btn" onclick="runCheck()" disabled>🔄 Run Daily Check</button>
      <select id="days-select">
        <option value="1">Last 1 day</option>
        <option value="3">Last 3 days</option>
        <option value="7">Last 7 days</option>
      </select>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabs" style="display:none;">
      <div class="tab active" data-tab="report">📊 PR Report</div>
      <div class="tab" data-tab="standup">📋 Standup</div>
    </div>

    <!-- Report Tab -->
    <div class="tab-content active" id="tab-report">
      <div id="results-area"></div>
    </div>

    <!-- Standup Tab -->
    <div class="tab-content" id="tab-standup">
      <div id="standup-area"></div>
    </div>
  </div>

  <script>
    // ─── State ────────────────────────────────────────────────────────────
    let token = localStorage.getItem('lgtm_token') || '';
    let repos = JSON.parse(localStorage.getItem('lgtm_repos') || '[]');
    let aiKeys = JSON.parse(localStorage.getItem('lgtm_ai_keys') || '{}');

    // ─── Init ─────────────────────────────────────────────────────────────
    (function init() {
      if (token) {
        document.getElementById('token-input').value = '••••••••••••••••';
      }
      if (aiKeys.openai) {
        document.getElementById('openai-key-input').value = '••••••••••••••••';
      }
      if (aiKeys.anthropic) {
        document.getElementById('anthropic-key-input').value = '••••••••••••••••';
      }
      updateAIStatus();
      renderRepos();
      updateRunButton();
      setupTabs();
    })();

    function setupTabs() {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
        });
      });
    }

    // ─── Token & Repos ────────────────────────────────────────────────────
    function saveToken() {
      const input = document.getElementById('token-input');
      if (input.value && !input.value.startsWith('••')) {
        token = input.value.trim();
        localStorage.setItem('lgtm_token', token);
        input.value = '••••••••••••••••';
      }
      updateRunButton();
    }

    function saveAIKey(provider) {
      const inputId = provider === 'openai' ? 'openai-key-input' : 'anthropic-key-input';
      const input = document.getElementById(inputId);
      if (input.value && !input.value.startsWith('••')) {
        aiKeys[provider] = input.value.trim();
        localStorage.setItem('lgtm_ai_keys', JSON.stringify(aiKeys));
        input.value = '••••••••••••••••';
        updateAIStatus();
      }
    }

    function updateAIStatus() {
      const el = document.getElementById('ai-status');
      const parts = [];
      if (aiKeys.openai) parts.push('<span style="color:var(--green)">✓ OpenAI</span>');
      if (aiKeys.anthropic) parts.push('<span style="color:var(--green)">✓ Anthropic</span>');
      if (parts.length > 0) {
        el.innerHTML = 'AI Keys: ' + parts.join(' · ');
      } else {
        el.innerHTML = '<span style="color:var(--muted)">No AI keys configured (optional — needed for auto-review)</span>';
      }
    }

    function addRepo() {
      const input = document.getElementById('repo-input');
      const value = input.value.trim();
      if (!value || !value.includes('/')) return;
      if (repos.includes(value)) return;
      repos.push(value);
      localStorage.setItem('lgtm_repos', JSON.stringify(repos));
      input.value = '';
      renderRepos();
      updateRunButton();
    }

    function removeRepo(repo) {
      repos = repos.filter(r => r !== repo);
      localStorage.setItem('lgtm_repos', JSON.stringify(repos));
      renderRepos();
      updateRunButton();
    }

    function renderRepos() {
      const el = document.getElementById('repo-list');
      el.innerHTML = repos.map(r =>
        `<span class="repo-tag">${r} <span class="remove" onclick="removeRepo('${r}')">✕</span></span>`
      ).join('');
    }

    function updateRunButton() {
      document.getElementById('run-btn').disabled = !token || repos.length === 0;
    }

    // ─── GitHub API ───────────────────────────────────────────────────────
    async function ghFetch(endpoint) {
      const res = await fetch(`https://api.github.com${endpoint}`, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
        },
      });
      if (!res.ok) throw new Error(`GitHub API ${res.status}: ${res.statusText}`);
      return res.json();
    }

    // ─── Run Check ────────────────────────────────────────────────────────
    async function runCheck() {
      const resultsArea = document.getElementById('results-area');
      const standupArea = document.getElementById('standup-area');
      const tabsEl = document.getElementById('tabs');

      resultsArea.innerHTML = '<div class="loading"><div class="spinner"></div>Fetching PR data...</div>';
      standupArea.innerHTML = '';
      tabsEl.style.display = 'flex';

      const days = parseInt(document.getElementById('days-select').value);
      const since = new Date();
      since.setDate(since.getDate() - days);

      try {
        const user = await ghFetch('/user');
        const username = user.login;

        const allPRs = [];
        const activities = { merged: [], reviewed: [], opened: [] };

        for (const repo of repos) {
          const [owner, name] = repo.split('/');

          // Fetch open PRs
          const openPRs = await ghFetch(`/repos/${owner}/${name}/pulls?state=open&per_page=30&sort=updated`);
          for (const pr of openPRs) {
            const ageHours = Math.floor((Date.now() - new Date(pr.created_at).getTime()) / 3600000);

            // Get CI status
            let ci = 'unknown';
            try {
              const checks = await ghFetch(`/repos/${owner}/${name}/commits/${pr.head.sha}/check-runs?per_page=10`);
              if (checks.check_runs && checks.check_runs.length > 0) {
                const allDone = checks.check_runs.every(c => c.status === 'completed');
                const anyFail = checks.check_runs.some(c => c.conclusion === 'failure' || c.conclusion === 'cancelled');
                const allPass = checks.check_runs.every(c => c.conclusion === 'success' || c.conclusion === 'skipped');
                if (allDone && allPass) ci = 'passing';
                else if (anyFail) ci = 'failing';
                else if (!allDone) ci = 'pending';
              }
            } catch {}

            // Get review status
            let review = 'pending';
            try {
              const reviews = await ghFetch(`/repos/${owner}/${name}/pulls/${pr.number}/reviews?per_page=10`);
              const states = reviews.map(r => r.state);
              if (states.includes('CHANGES_REQUESTED')) review = 'changes_requested';
              else if (states.includes('APPROVED')) review = 'approved';
            } catch {}

            const recommendation = getRecommendation(ci, review, pr.mergeable, ageHours, pr.draft);

            allPRs.push({
              number: pr.number,
              title: pr.title,
              author: pr.user?.login || 'unknown',
              repo,
              url: pr.html_url,
              ageHours,
              draft: pr.draft,
              mergeable: pr.mergeable,
              ci,
              review,
              additions: pr.additions || 0,
              deletions: pr.deletions || 0,
              changedFiles: pr.changed_files || 0,
              recommendation,
            });

            // Track recently opened (for standup)
            if (new Date(pr.created_at) >= since) {
              activities.opened.push({ repo, number: pr.number, title: pr.title, author: pr.user?.login });
            }
          }

          // Fetch recently merged (for standup)
          try {
            const closedPRs = await ghFetch(`/repos/${owner}/${name}/pulls?state=closed&sort=updated&direction=desc&per_page=15`);
            for (const pr of closedPRs) {
              if (pr.merged_at && new Date(pr.merged_at) >= since) {
                activities.merged.push({ repo, number: pr.number, title: pr.title, author: pr.user?.login });
              }
            }
          } catch {}
        }

        // Sort PRs
        const sortOrder = { blocked: 0, stale: 1, needs_attention: 2, ready: 3 };
        allPRs.sort((a, b) => sortOrder[a.recommendation] - sortOrder[b.recommendation] || b.ageHours - a.ageHours);

        renderReport(allPRs);
        renderStandup(allPRs, activities, days, username);

      } catch (err) {
        resultsArea.innerHTML = `<div class="empty-state"><div class="icon">❌</div><p>Error: ${err.message}</p><p style="font-size:0.8rem;margin-top:0.5rem;">Check your token and repo names.</p></div>`;
      }
    }

    // ─── Recommendation Logic ─────────────────────────────────────────────
    function getRecommendation(ci, review, mergeable, ageHours, draft) {
      if (ci === 'failing' || mergeable === false) return 'blocked';
      if (ci === 'passing' && review === 'approved' && mergeable !== false && !draft) return 'ready';
      if (ageHours > 72) return 'stale';
      return 'needs_attention';
    }

    // ─── Render Report ────────────────────────────────────────────────────
    function renderReport(prs) {
      const area = document.getElementById('results-area');

      if (prs.length === 0) {
        area.innerHTML = '<div class="empty-state"><div class="icon">✓</div><p>No open PRs across watched repos.</p></div>';
        return;
      }

      const ready = prs.filter(p => p.recommendation === 'ready');
      const attention = prs.filter(p => p.recommendation === 'needs_attention');
      const blocked = prs.filter(p => p.recommendation === 'blocked');
      const stale = prs.filter(p => p.recommendation === 'stale');

      let html = `
        <div class="summary-bar">
          <div class="summary-stat"><div class="num">${prs.length}</div><div class="label">Total Open</div></div>
          <div class="summary-stat green"><div class="num">${ready.length}</div><div class="label">Ready</div></div>
          <div class="summary-stat yellow"><div class="num">${attention.length}</div><div class="label">Attention</div></div>
          <div class="summary-stat red"><div class="num">${blocked.length}</div><div class="label">Blocked</div></div>
          <div class="summary-stat gray"><div class="num">${stale.length}</div><div class="label">Stale</div></div>
        </div>
      `;

      if (ready.length) html += renderSection('✓ Ready to Merge', ready, 'ready');
      if (attention.length) html += renderSection('⚠ Needs Attention', attention, 'attention');
      if (blocked.length) html += renderSection('✗ Blocked', blocked, 'blocked');
      if (stale.length) html += renderSection('○ Stale (>3 days)', stale, 'stale');

      area.innerHTML = html;
    }

    function renderSection(title, prs, type) {
      const icons = { ready: '✓', attention: '⚠', blocked: '✗', stale: '○' };
      let html = `<div class="section-header"><h3>${title}</h3><span class="count">${prs.length}</span></div>`;

      for (const pr of prs) {
        const ciClass = pr.ci === 'passing' ? 'ci-pass' : pr.ci === 'failing' ? 'ci-fail' : 'ci-pending';
        const ciLabel = pr.ci === 'passing' ? '✓ CI' : pr.ci === 'failing' ? '✗ CI' : '◌ CI';
        const age = formatAge(pr.ageHours);

        html += `
          <div class="pr-card">
            <div class="status-icon">${icons[type] || '○'}</div>
            <div class="pr-info">
              <div class="pr-title"><a href="${pr.url}" target="_blank">#${pr.number}</a> ${escapeHtml(pr.title)}${pr.draft ? ' <span style="color:var(--muted)">[draft]</span>' : ''}</div>
              <div class="pr-meta">${pr.repo} · @${pr.author} · ${age} · +${pr.additions} -${pr.deletions} (${pr.changedFiles} files)</div>
              <div class="pr-badges">
                <span class="pr-badge ${ciClass}">${ciLabel}</span>
                <span class="pr-badge ${type}">${pr.recommendation.replace('_', ' ')}</span>
                ${pr.mergeable === false ? '<span class="pr-badge blocked">⚡ conflict</span>' : ''}
                ${pr.review === 'approved' ? '<span class="pr-badge ready">approved</span>' : ''}
                ${pr.review === 'changes_requested' ? '<span class="pr-badge blocked">changes requested</span>' : ''}
              </div>
            </div>
          </div>
        `;
      }

      return html;
    }

    // ─── Render Standup ───────────────────────────────────────────────────
    function renderStandup(prs, activities, days, username) {
      const area = document.getElementById('standup-area');
      const dateStr = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
      const periodLabel = days === 1 ? 'Yesterday' : `Last ${days} days`;

      let md = `## 📋 Standup — ${dateStr}\n\n`;
      md += `### ${periodLabel}\n\n`;

      if (activities.merged.length === 0 && activities.opened.length === 0) {
        md += '_No tracked activity._\n\n';
      } else {
        if (activities.merged.length > 0) {
          md += '**Merged:**\n';
          for (const a of activities.merged) {
            md += `- #${a.number} ${a.title} (${a.repo})\n`;
          }
          md += '\n';
        }
        if (activities.opened.length > 0) {
          md += '**Opened:**\n';
          for (const a of activities.opened) {
            md += `- #${a.number} ${a.title} (${a.repo})\n`;
          }
          md += '\n';
        }
      }

      md += '### Today\n\n';

      const priorities = [];
      for (const pr of prs) {
        if (pr.recommendation === 'blocked') {
          priorities.push(`- ✗ #${pr.number} ${pr.title} — ${pr.ci === 'failing' ? 'CI failing' : 'merge conflict'}`);
        } else if (pr.recommendation === 'stale') {
          priorities.push(`- ⏰ #${pr.number} ${pr.title} — open ${formatAge(pr.ageHours)}, needs review`);
        } else if (pr.recommendation === 'ready') {
          priorities.push(`- ✓ #${pr.number} ${pr.title} — ready to merge!`);
        }
      }

      if (priorities.length === 0) {
        md += '_No pending items. All clear!_ ✓\n';
      } else {
        md += priorities.join('\n') + '\n';
      }

      md += `\n---\n_Generated by LGTM Daily Checker at ${new Date().toISOString().split('T')[0]}${username ? ` for @${username}` : ''}_`;

      area.innerHTML = `
        <div class="standup-output">
          <button class="btn-secondary copy-btn" onclick="copyStandup()">📋 Copy</button>
          <div id="standup-text">${escapeHtml(md)}</div>
        </div>
      `;
    }

    function copyStandup() {
      const text = document.getElementById('standup-text').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = '✓ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
      });
    }

    // ─── Helpers ──────────────────────────────────────────────────────────
    function formatAge(hours) {
      if (hours < 1) return 'just now';
      if (hours < 24) return `${hours}h`;
      const days = Math.floor(hours / 24);
      return days === 1 ? '1 day' : `${days} days`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Allow Enter key in inputs
    document.getElementById('token-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveToken(); });
    document.getElementById('repo-input').addEventListener('keydown', e => { if (e.key === 'Enter') addRepo(); });
  </script>
</body>
</html>
